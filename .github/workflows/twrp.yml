name: Recovery Build (TWRP)

on:
  workflow_dispatch: # Кнопка для ручного запуска билда

env:
  MANIFEST_URL: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
  MANIFEST_BRANCH: twrp-12.1 # Стабильная база для Unisoc чипсетов
  DEVICE_NAME: RMX3930
  BUILD_TARGET: vendorboot # У Realme C61 рекавери собирается прямо в boot.img

jobs:
  build:
    runs-on: ubuntu-22.04 # Используем стабильную LTS версию Ubuntu
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Cleanup Environment (Free Space)
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker rmi $(docker images -q) || true

      - name: Install Build Environment & Dependencies
        run: |
          # Принудительно отключаем панику apt-get из-за битых зеркал Ubuntu
          sudo apt-get -o Acquire::Check-Valid-Until=false -o Acquire::AllowInsecureRepositories=true -o Acquire::AllowUnauthenticated=true update || true
          sudo apt-get install -y --fix-missing --allow-unauthenticated bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip openjdk-11-jdk libncurses5 || true

      - name: Set Up Repo Tool
        run: |
          mkdir -p ~/bin
          # ИСПРАВЛЕНО: Ссылка теперь указывает непосредственно на raw-файл скрипта repo внутри репозитория
          RAW_REPO_URL="https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo"
          CLEAN_REPO_URL=$(echo "$RAW_REPO_URL" | sed 's/[^a-zA-Z0-9:./_-]//g')
          curl "$CLEAN_REPO_URL" > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize TWRP Source
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          git config --global user.name "intvern"
          git config --global user.email "intvern-dev@github.com"
          
          RAW_MANIFEST="${{ env.MANIFEST_URL }}"
          CLEAN_MANIFEST=$(echo "$RAW_MANIFEST" | sed 's/[^a-zA-Z0-9:./_-]//g')
          
          # ИСПРАВЛЕНО: Добавлен обязательный суффикс .git к адресу манифеста, если утилита repo не сможет распарсить короткий URL
          repo init --depth=1 -u "${CLEAN_MANIFEST}.git" -b ${{ env.MANIFEST_BRANCH }}
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Your Device Tree
        run: |
          cd ~/twrp
          RAW_TREE_URL="https://github.com/intvern/REALME-C61-DEVICE-TREE-TWRP"
          CLEAN_TREE_URL=$(echo "$RAW_TREE_URL" | sed 's/[^a-zA-Z0-9:./_-]//g')
          git clone $CLEAN_TREE_URL -b main temp_tree
          mkdir -p device/realme
          mv temp_tree/device/realme/RMX3930 device/realme/RMX3930
          rm -rf temp_tree

      - name: Building Recovery (TWRP)
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_${{ env.DEVICE_NAME }}-eng
          make clean
          mkdir -p ~/twrp/out/target/product/RMX3930
          cp ~/twrp/device/realme/RMX3930/prebuilt/dtb.img ~/twrp/out/target/product/RMX3930/dtb.img
          make ${{ env.BUILD_TARGET }}image -j$(nproc --all)


      - name: Upload Finished Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Realme-C61-VendorBoot
          path: /home/runner/twrp/out/target/product/RMX3930/vendor_boot.img
