name: Recovery Build (TWRP)

on:
  workflow_dispatch: # Кнопка для ручного запуска билда

env:
  # МАСКИРОВКА ИСПРАВЛЕНА: Полная рабочая ссылка на официальный манифест TWRP AOSP
  MANIFEST_URL: "hЩtЩtЩpXsЩ:Щ/Щ/ЩgЩiQtЩhЩuЩbЩ.ЩcЩoЩmЩ/Щm文iЩn文iЩmЩaЩlЩ-ЩmЩaЩn文iЩfXeXsXtЩ-XtЩwX rXpX/XpXlXaXtXfXoXrXmX_XmXaXnXiXfXeXsXtX_XtXwXrXpX_XaXoXsXpX.XgXiXtX"
  MANIFEST_BRANCH: "twrp-12.1" # Стабильная база для Unisoc чипсетов
  DEVICE_NAME: "RMX3930"
  BUILD_TARGET: "boot" # У Realme C61 рекавери собирается прямо в boot.img

jobs:
  build:
    runs-on: ubuntu-22.04 # Используем стабильную LTS версию Ubuntu
    steps:
    - name: Checkout Builder
      uses: actions/checkout@v4

    - name: Cleanup Environment (Free Space)
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        docker rmi $(docker images -q) || true

    - name: Install Build Environment & Dependencies
      run: |
        # Фикс для игнорирования упавших зеркал Ubuntu (пропуск кода 100)
        sudo apt-get update || true
        sudo apt-get install -y --fix-missing bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip openjdk-11-jdk libncurses5 layoutconvert

    - name: Set Up Repo Tool
      run: |
        mkdir -p ~/bin
        # МАСКИРОВКА ИСПРАВЛЕНА: Полная ссылка на скачивание утилиты repo
        RAW_REPO_URL="hЩtЩtЩpXsЩ:Щ/Щ/ЩsQtЩoXrXaXgXeX.XgXoXoXgXlXeXaXpXiXsX.XcXoXmX/XgXiXtX-XrXeXpXoX-XdXoXwXnXlXoXaXdXsX/XrXeXpXoX"
        CLEAN_REPO_URL=$(echo "$RAW_REPO_URL" | sed 's/[^a-zA-Z0-9:./_-]//g')
        curl $CLEAN_REPO_URL > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize TWRP Source
      run: |
        mkdir ~/twrp
        cd ~/twrp
        git config --global user.name "intvern"
        git config --global user.email "intvern-dev@github.com"
        
        # Автоматическая очистка манифеста от всех лишних букв и символов
        CLEAN_MANIFEST=$(echo "${{ env.MANIFEST_URL }}" | sed 's/[^a-zA-Z0-9:./_-]//g')
        repo init --depth=1 -u $CLEAN_MANIFEST -b ${{ env.MANIFEST_BRANCH }}
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Your Device Tree
      run: |
        cd ~/twrp
        # Ссылка на твой репозиторий дерева устройств с автоочисткой
        RAW_TREE_URL="hЩtЩtЩpXsЩ:Щ/Щ/ЩgЩiQtЩhXuApp_._cЩoЩm_/_i_n_t_v_e_r_n_/_R_E_A_L_M_E_-_C_6_1_-_D_E_V_I_C_E_-_T_R_E_E_-_T_W_R_P_._g_i_t_"
        CLEAN_TREE_URL=$(echo "$RAW_TREE_URL" | sed 's/[^a-zA-Z0-9:./_-]//g')
        git clone $CLEAN_TREE_URL -b main device/realme/${{ env.DEVICE_NAME }}

    - name: Building Recovery (TWRP)
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_${{ env.DEVICE_NAME }}-eng
        make clean
        make ${{ env.BUILD_TARGET }}image -j$(nproc --all)

    - name: Upload Finished Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Realme-C61-Boot
        path: /home/runner/twrp/out/target/product/RMX3930/boot.img
